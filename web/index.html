<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>靈魂配對測量儀</title>
  <!-- The app's icon. Without these, browsers go looking for icons at the site root. -->
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="device">
    <div id="field" aria-hidden="true">
      <div class="field-subject">
        <div class="field-half"></div>
        <div class="field-half field-peer"></div>
      </div>
      <div class="field-scrim"></div>
      <div class="scanlines"></div>
      <div class="field-noise"></div>
    </div>
    <div id="stage"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
