name: Deploy privacy policy

on:
  push:
    branches: [main]
    paths: ['privacy/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./privacy
          destination: ./_site
      # The web version is plain static files, served as-is at /play/.
      # Jekyll writes _site as root, hence sudo.
      - name: Add the web version at /play/
        run: sudo cp -r web _site/play
      # Browsers keep these files for ten minutes, and their names never
      # change. Stamping every reference with the commit means a page always
      # loads the scripts and styles it was published with, never a mix.
      - name: Stamp the web version's files with the commit
        run: |
          v="${GITHUB_SHA::8}"
          sudo perl -pi -e "s#(from '\./[\w-]+\.js)'#\$1?v=$v'#g" _site/play/js/*.js
          sudo perl -pi -e "s#(href=\"styles\.css|src=\"js/main\.js)\"#\$1?v=$v\"#g" _site/play/index.html
          # Fail the deploy rather than publish a reference that was missed.
          if grep -nE "from '\./[^']*\.js'" _site/play/js/*.js; then exit 1; fi
          test "$(grep -o "?v=$v" _site/play/index.html | wc -l)" -eq 2
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
